<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleta — TAMPAÊ</title>
<link rel="stylesheet" href="qr.css">
</head>
<body>
<main class="coleta-page">
    <section id="statePermissao" class="state">
        <h1>Conectar à máquina</h1>
        <p>Permita o acesso à câmera para ler o QR Code da máquina.</p>
        <button id="btnPedirPermissao" class="btn">Ler QR Code</button>
    </section>

    <section id="stateErro" class="state" style="display:none">
        <h1>Não foi possível conectar</h1>
        <p id="erroTexto"></p>
        <button id="btnTentarNovamente" class="btn">Tentar novamente</button>
    </section>

    <section id="stateConectando" class="state" style="display:none">
        <h1>Conectando</h1>
        <p id="conectandoTexto">Validando máquina...</p>
    </section>

    <section id="scanOverlay" style="display:none">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" hidden></canvas>
    </section>

    <section id="sessionView" class="state" style="display:none">
        <h1>Sessão ativa</h1>
        <p id="maquinaNome"></p>
        <div class="timer">
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="44"></circle>
                <circle id="anelTempo" cx="50" cy="50" r="44"></circle>
            </svg>
            <strong id="tempoRestante">00:00</strong>
        </div>
        <p>Aguarde a máquina registrar suas coletas.</p>
    </section>

    <section id="stateFinalizando" class="state" style="display:none">
        <h1>Finalizando sessão</h1>
        <p>Aguarde a máquina concluir as últimas coletas.</p>
        <strong id="tempoFinalizacao">5s</strong>
    </section>

    <section id="stateEncerrada" class="state" style="display:none">
        <h1 id="encerradaTitulo">Sessão encerrada</h1>
        <strong id="pontosGanhos">+0 pts</strong>
        <p id="encerradaTexto"></p>
        <button id="btnEscanearDeNovo" class="btn">Escanear outra máquina</button>
    </section>
</main>
<script type="module" src="qr.js"></script>
</body>
</html>
