<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TampAê · Laboratório de Testes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111827;color:#f9fafb;min-height:100vh;display:flex;flex-direction:column}.barra{height:64px;padding:0 18px;display:flex;align-items:center;gap:14px;background:#0b1220;border-bottom:1px solid #263244;flex-shrink:0}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#15803d,#22c55e);display:grid;place-items:center;font-weight:900}.titulo{font-weight:800}.sub{font-size:12px;color:#94a3b8}.acoes{margin-left:auto;display:flex;gap:8px}.acoes button,.pagina{border:1px solid #334155;background:#1e293b;color:#e5e7eb;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700}.acoes button:hover,.pagina:hover{background:#334155}.layout{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0}.painel{padding:16px;background:#0f172a;border-right:1px solid #263244;overflow:auto}.painel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:0 0 10px}.paginas{display:grid;gap:7px}.pagina{text-align:left;width:100%}.pagina.ativa{border-color:#22c55e;background:#14532d}.teste{margin-top:24px;padding-top:18px;border-top:1px solid #263244}.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#cbd5e1;margin:10px 0}.check input{accent-color:#22c55e;margin-top:2px}.status{margin-top:16px;padding:12px;border-radius:10px;background:#111827;border:1px solid #263244;font-size:12px;color:#94a3b8}.status b{display:block;color:#f9fafb;margin-bottom:4px}.area{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(circle at center,#1e293b 0,#111827 55%)}.dispositivo{position:relative;width:390px;height:780px;max-width:90vw;max-height:calc(100vh - 112px);border:10px solid #020617;border-radius:34px;background:#000;box-shadow:0 20px 70px rgba(0,0,0,.55),0 0 0 1px #475569;overflow:hidden;transition:width .2s,height .2s}.dispositivo.desktop{width:min(1100px,92vw);height:min(760px,calc(100vh - 112px));border-radius:18px}.dispositivo.tablet{width:768px;height:min(900px,calc(100vh - 112px));border-radius:24px}.dispositivo iframe{width:100%;height:100%;border:0;background:#fff}.dimensao{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:11px ui-monospace,SFMono-Regular,monospace;color:#94a3b8;pointer-events:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.painel{border-right:0;border-bottom:1px solid #263244;max-height:230px}.area{padding:14px}.dispositivo{max-height:calc(100vh - 330px)}}
</style>
</head>
<body>
<header class="barra"><div class="logo">T</div><div><div class="titulo">TampAê · Laboratório de Testes</div><div class="sub">Simulador de navegador para validar as telas do sistema</div></div><div class="acoes"><button id="reload">↻ Recarregar</button><button id="abrir">Abrir página</button></div></header>
<div class="layout">
<aside class="painel">
<h2>Telas</h2>
<div class="paginas">
<button class="pagina ativa" data-page="../app/pages/inicio/home.html">🏠 Início</button>
<button class="pagina" data-page="../app/pages/login/index.html">🔐 Login</button>
<button class="pagina" data-page="../app/pages/mapa/mapa.html">🗺️ Mapa</button>
<button class="pagina" data-page="../app/pages/ranking/rank.html">🏆 Ranking</button>
<button class="pagina" data-page="../app/pages/coleta/qr.html">📷 Coleta / QR</button>
<button class="pagina" data-page="../app/pages/perfil/perfil.html">👤 Perfil</button>
<button class="pagina" data-page="../app/pages/configura/configuracoes.html">⚙️ Configurações</button>
</div>
<div class="teste"><h2>Checklist</h2>
<label class="check"><input type="checkbox"> Layout alinhado e sem elementos cortados</label>
<label class="check"><input type="checkbox"> Botões respondem ao toque/clique</label>
<label class="check"><input type="checkbox"> Navegação entre telas funciona</label>
<label class="check"><input type="checkbox"> Formulários exibem validação correta</label>
<label class="check"><input type="checkbox"> Tela mobile está responsiva</label>
<label class="check"><input type="checkbox"> Console sem erros críticos</label>
</div>
<div class="status"><b id="nomePagina">Início</b><span id="urlPagina">../app/pages/inicio/home.html</span></div>
</aside>
<main class="area">
<div class="dispositivo" id="device"><iframe id="preview" title="Pré-visualização do TampAê"></iframe><div class="dimensao" id="dimensao">390 × 780</div></div>
</main>
</div>
<script>
const frame=document.getElementById('preview'),device=document.getElementById('device'),dim=document.getElementById('dimensao'),nome=document.getElementById('nomePagina'),url=document.getElementById('urlPagina');let pagina='../app/pages/inicio/home.html';
const nomes={'../app/pages/inicio/home.html':'Início','../app/pages/login/index.html':'Login','../app/pages/mapa/mapa.html':'Mapa','../app/pages/ranking/rank.html':'Ranking','../app/pages/coleta/qr.html':'Coleta / QR','../app/pages/perfil/perfil.html':'Perfil','../app/pages/configura/configuracoes.html':'Configurações'};
function carregar(p){pagina=p;frame.src=p;nome.textContent=nomes[p]||'Página';url.textContent=p;document.querySelectorAll('.pagina').forEach(b=>b.classList.toggle('ativa',b.dataset.page===p));}
document.querySelectorAll('.pagina').forEach(b=>b.addEventListener('click',()=>carregar(b.dataset.page)));
document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();
document.getElementById('abrir').onclick=()=>window.open(pagina,'_blank','noopener');
function tamanho(tipo,w,h){device.classList.toggle('desktop',tipo==='desktop');device.classList.toggle('tablet',tipo==='tablet');if(tipo==='mobile'){device.style.width='390px';device.style.height='780px'}else if(tipo==='tablet'){device.style.width='768px';device.style.height='900px'}else{device.style.width='1100px';device.style.height='760px'}dim.textContent=w+' × '+h}
const botoes=[['Mobile','390','780'],['Tablet','768','900'],['Desktop','1100','760']];const acoes=document.querySelector('.acoes');botoes.forEach(([t,w,h])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>tamanho(t.toLowerCase(),w,h);acoes.insertBefore(b,document.getElementById('reload'))});
carregar(pagina);
</script>
</body>
</html>
